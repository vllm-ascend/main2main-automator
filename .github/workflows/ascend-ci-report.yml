# ascend-ci-report: daily Ascend NPU Test failure monitor.
# Source of truth: tools/ascend-npu-report/workflow/ascend-ci-report.yml
# Keep this root copy in sync (GitHub Actions only reads .github/workflows/).
name: ascend-ci-report
on:
  schedule:
    - cron: "0 1 * * *"      # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:          # 手动触发/补数入口，支持配置时间窗
    inputs:
      date:
        description: '查询日期（窗口起始日，UTC，YYYY-MM-DD）。留空 = 按增量调度'
        required: false
        default: ''
      backfill_days:
        description: '回溯天数 N（从现在向前回溯 N 天）。与"查询日期"二选一'
        required: false
        default: ''
      refetch:
        description: '忽略已处理记录，重新拉取日志并覆盖分析'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
defaults:
  run:
    working-directory: tools/ascend-npu-report   # 工具自包含目录（design.md 第 10 节）
jobs:
  report:
    runs-on: linux-aarch64-a2b3-8   # 自托管 ARM64 runner
    timeout-minutes: 15
    env:                                        # job 级：run 步骤的进程可读
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
      GITHUB_PR_TOKEN: ${{ github.token }}      # Actions 内置 token：认证 GitHub API 1000 req/h，零配置
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run report
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          elif [ -n "${{ inputs.backfill_days }}" ]; then
            ARGS="$ARGS --backfill ${{ inputs.backfill_days }}"
          fi
          if [ "${{ inputs.refetch }}" = "true" ]; then
            ARGS="$ARGS --refetch"
          fi
          ascend-ci-report run $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.run_id }}
          path: |                              # artifact 路径相对仓库根
            tools/ascend-npu-report/reports/
            tools/ascend-npu-report/store/logs/
      - name: Commit reports
        working-directory: ${{ github.workspace }}   # git 操作回仓库根
        run: |
          git config user.name "ascend-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/ascend-npu-report/reports/
          git diff --cached --quiet || git commit -m "ascend report: $(date -u +%F)"
          git push
